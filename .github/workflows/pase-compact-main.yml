name: PASE compact main results checks
on:
  push:
    branches: [research/pase-compact-v3]
    paths:
      - experiments/pase_compact_main/**
      - tests/test_pase_compact_main_*.py
      - scripts/run_pase_compact_main.sh
      - .github/workflows/pase-compact-main.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU numerical stack
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.24.4 scipy==1.11.4 tqdm==4.67.1
      - name: Syntax and shell
        run: |
          python -m compileall -q experiments/pase_compact_main
          bash -n scripts/run_pase_compact_main.sh
      - name: Existing compact contracts
        run: python -m unittest discover -s tests -p 'test_pase_compact_v3_*.py' -v
      - name: Main training resume, test selection and launcher
        run: python -m unittest discover -s tests -p 'test_pase_compact_main_*.py' -v
